apiVersion: v1
kind: Service
metadata:
  name: {{ include "celld.fullname" . }}-internal
  labels:
    {{- include "celld.labels" . | nindent 4 }}
    {{- with .Values.internalService.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.internalService.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: internal
      port: {{ .Values.server.internalPort }}
      targetPort: internal
      protocol: TCP
  selector:
    {{- include "celld.selectorLabels" . | nindent 4 }}
