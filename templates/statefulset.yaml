{{- $bucket := .Values.celld.bucket -}}
{{- if and .Values.azurite.enabled (not $bucket) -}}
{{- $bucket = printf "az://%s" .Values.azurite.container -}}
{{- end -}}
{{- $volumeClaimTemplateLabels := dict -}}
{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) -}}
{{- $existingStatefulSet := lookup "apps/v1" "StatefulSet" .Release.Namespace (include "celld.fullname" .) -}}
{{- if $existingStatefulSet -}}
{{- $existingVolumeClaimTemplates := dig "spec" "volumeClaimTemplates" (list) $existingStatefulSet -}}
{{- if gt (len $existingVolumeClaimTemplates) 0 -}}
{{- $volumeClaimTemplateLabels = dig "metadata" "labels" (dict) (index $existingVolumeClaimTemplates 0) -}}
{{- end -}}
{{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "celld.fullname" . }}
  labels:
    {{- include "celld.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  serviceName: {{ include "celld.fullname" . }}-internal
  selector:
    matchLabels:
      {{- include "celld.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "celld.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "celld.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.azurite.enabled }}
      initContainers:
        - name: azurite-init
          image: "{{ .Values.azurite.initImage.repository }}:{{ .Values.azurite.initImage.tag }}"
          imagePullPolicy: {{ .Values.azurite.initImage.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ include "celld.azurite.secretName" . }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              i=0
              while [ "$i" -lt 30 ]; do
                if az storage container create -n {{ .Values.azurite.container | quote }} --connection-string "$AZURE_STORAGE_CONNECTION_STRING"; then
                  exit 0
                fi
                i=$((i + 1))
                sleep 2
              done
              echo "azurite did not accept container create" >&2
              exit 1
        {{- if .Values.azurite.bootstrapPlaceholder }}
        - name: celld-deploy
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - secretRef:
                name: {{ include "celld.azurite.secretName" . }}
          env:
            - name: CELLD_BUCKET
              value: {{ $bucket | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends socat curl ca-certificates xz-utils
              cd /tmp
              curl -fsSL https://esbuild.github.io/dl/v0.25.5 | sh
              export PATH="/tmp:$PATH"
              socat TCP-LISTEN:{{ .Values.azurite.blobPort }},bind=127.0.0.1,fork,reuseaddr TCP:{{ include "celld.azurite.fullname" . }}:{{ .Values.azurite.blobPort }} &
              i=0
              while [ "$i" -lt 30 ]; do
                if socat /dev/null TCP:127.0.0.1:{{ .Values.azurite.blobPort }},connect-timeout=1 >/dev/null 2>&1; then
                  break
                fi
                i=$((i + 1))
                sleep 1
              done
              celld deploy /placeholder --bucket "$CELLD_BUCKET"
          volumeMounts:
            - name: placeholder
              mountPath: /placeholder
        {{- end }}
      {{- end }}
      containers:
        {{- if .Values.azurite.enabled }}
        - name: azurite-forward
          image: "{{ .Values.azurite.socatImage.repository }}:{{ .Values.azurite.socatImage.tag }}"
          imagePullPolicy: {{ .Values.azurite.socatImage.pullPolicy }}
          args:
            - TCP-LISTEN:{{ .Values.azurite.blobPort }},bind=127.0.0.1,fork,reuseaddr
            - TCP:{{ include "celld.azurite.fullname" . }}:{{ .Values.azurite.blobPort }}
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              memory: 32Mi
        {{- end }}
        - name: celld
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - /bin/sh
            - -c
            - |
              exec /usr/local/bin/celld \
                {{- if $bucket }}
                --bucket {{ $bucket | quote }} \
                {{- end }}
                --listen 0.0.0.0:{{ .Values.server.httpPort }} \
                --internal-listen 0.0.0.0:{{ .Values.server.internalPort }} \
                --advertise "${POD_IP}:{{ .Values.server.internalPort }}"
          ports:
            - name: http
              containerPort: {{ .Values.server.httpPort }}
              protocol: TCP
            - name: internal
              containerPort: {{ .Values.server.internalPort }}
              protocol: TCP
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: CELLD_WATCH
              value: /var/lib/celld/state
            {{- if $bucket }}
            - name: CELLD_BUCKET
              value: {{ $bucket | quote }}
            {{- end }}
            {{- if and (not .Values.azurite.enabled) .Values.celld.region }}
            - name: AWS_REGION
              value: {{ .Values.celld.region | quote }}
            - name: AWS_DEFAULT_REGION
              value: {{ .Values.celld.region | quote }}
            {{- end }}
            {{- if and (not .Values.azurite.enabled) .Values.celld.endpoint }}
            - name: S3_ENDPOINT
              value: {{ .Values.celld.endpoint | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if or .Values.azurite.enabled .Values.credentials.existingSecret .Values.extraEnvFrom }}
          envFrom:
            {{- if .Values.azurite.enabled }}
            - secretRef:
                name: {{ include "celld.azurite.secretName" . }}
            {{- end }}
            {{- if .Values.credentials.existingSecret }}
            - secretRef:
                name: {{ .Values.credentials.existingSecret }}
            {{- end }}
            {{- with .Values.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if .Values.azurite.enabled }}
          startupProbe:
            httpGet:
              path: /__celld/health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          {{- end }}
          readinessProbe:
            httpGet:
              path: /__celld/health
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /__celld/health
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/celld
            - name: tmp
              mountPath: /tmp
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if and .Values.azurite.enabled .Values.azurite.bootstrapPlaceholder }}
        - name: placeholder
          configMap:
            name: {{ include "celld.fullname" . }}-placeholder
        {{- end }}
        {{- if .Values.persistence.existingClaim }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- else if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- if $volumeClaimTemplateLabels }}
          {{- toYaml $volumeClaimTemplateLabels | nindent 10 }}
          {{- else }}
          {{- include "celld.labels" . | nindent 10 }}
          {{- end }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- if .Values.persistence.storageClassName }}
        storageClassName: {{ .Values.persistence.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
{{- end }}
