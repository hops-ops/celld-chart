nameOverride: ""
fullnameOverride: ""

commonLabels: {}

replicaCount: 1

image:
  repository: ghcr.io/denoland/celld
  tag: "v0.3.0"
  pullPolicy: IfNotPresent

celld:
  # Fleet bucket. S3 (`s3://bucket`), GCS (`gs://bucket`), or Azure (`az://container`).
  # Optional key prefix: s3://bucket/prefix
  bucket: ""
  # S3-compatible endpoint (R2, Tigris). Leave empty for AWS S3.
  endpoint: ""
  region: us-east-2

server:
  httpPort: 8080
  internalPort: 8081

credentials:
  # Secret with AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (and optional AWS_SESSION_TOKEN).
  # For GCS use GOOGLE_APPLICATION_CREDENTIALS via extraEnv + extraVolume, or ADC.
  existingSecret: ""

# Deploy a tiny fetch-only worker so celld can boot before a real app is uploaded.
# Used for Azurite and for a fresh S3 bucket (celld requires deploy/current.json).
bootstrapPlaceholder: false

# Local/dev only. Deploys Azurite and points celld at it (az:// container).
# Not a production fleet store. Matches tests/celld/docker-compose.yml:
# celld's Azure emulator client always uses 127.0.0.1:10000, so a socat
# sidecar forwards that port to the Azurite Service.
azurite:
  enabled: false
  container: celld
  blobPort: 10000
  # Public Microsoft Azurite emulator account — not a production secret.
  accountName: devstoreaccount1
  accountKey: Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==
  image:
    repository: mcr.microsoft.com/azure-storage/azurite
    tag: "3.34.0"
    pullPolicy: IfNotPresent
  initImage:
    repository: mcr.microsoft.com/azure-cli
    tag: "2.89.1"
    pullPolicy: IfNotPresent
  socatImage:
    repository: docker.io/alpine/socat
    tag: "1.8.1.3"
    pullPolicy: IfNotPresent
  bootstrapPlaceholder: true
  persistence:
    enabled: true
    size: 2Gi
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi

extraEnv: []
extraEnvFrom: []

persistence:
  enabled: true
  size: 10Gi
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  existingClaim: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

service:
  type: ClusterIP
  port: 8080
  labels: {}
  annotations: {}

internalService:
  labels: {}
  annotations: {}

podLabels: {}
podAnnotations: {}

# celld's published image is debian:bookworm-slim with no dedicated runtime user.
podSecurityContext: {}

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 2Gi

terminationGracePeriodSeconds: 35

probes:
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 6
  liveness:
    initialDelaySeconds: 15
    periodSeconds: 20
    timeoutSeconds: 2
    failureThreshold: 6
